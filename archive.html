<html lang="en">
<head>

<body>
<div class="cursor"></div>
<header>
  <a class="logo" href="index.html">Hyerin KW</a>
  <nav>
    <a href="index.html">Work</a>
    <a href="archive.html" class="on">Archive</a>
    <a href="https://www.linkedin.com/in/hyerinkw/">Linkedin</a>
  </nav>
</header>

<main class="top a-set">

<section class="a-hero" id="hero">
  <img src="./archive images/ME.jpg" alt="">
  <p>An archive of personal work. Made slowly, kept quietly.</p>
</section>

<section>
<div class="a-row">

  <!-- 세로 (기존 그대로) -->
  <figure class="a-film v" data-speed="900">
    <img class="on" src="./archive images/Btote02.jpeg" alt="Screen printing 1">
    <img src="./archive images/Btote01.jpeg" alt="Screen printing 2">
    <img src="./archive images/coverB.jpg"   alt="Screen printing 3">
    <img src="./archive images/inB.jpeg"     alt="Screen printing 4">
    <img src="./archive images/inB2.jpeg"    alt="Screen printing 5">
    <img src="./archive images/inB3.jpeg"    alt="Screen printing 6">
    <figcaption class="a-count">1/6</figcaption>
    <span class="a-bar"></span>
  </figure>

  <!-- 가로 (새로 추가, 5장) -->
  <figure class="a-film h" data-speed="1100">
    <img class="on" src="./archive images/HopeBcover.jpg" alt="Work 1">
    <img src="./archive images/HopeB01.jpg" alt="Work 2">
    <img src="./archive images/HopeB02.jpg" alt="Work 3">
    <img src="./archive images/HopeB03.jpg" alt="Work 4">
    <img src="./archive images/HopeB04.jpeg" alt="Work 5">
    <figcaption class="a-count">1/5</figcaption>
    <span class="a-bar"></span>
  </figure>

</div>

</section>
</main>

     <!-- JavaScript -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/luminous-lightbox/2.3.2/luminous.min.js"></script>
