<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital@1&family=Pinyon+Script&display=swap" rel="stylesheet">
<link rel="icon" href="./images/kim.png" type="image/png">
<link rel="stylesheet" href="./css/style.css">

<style>
  .a-set { padding-bottom: 14vh; }

  /* ===== 영상처럼 넘어가는 프레임 1개 ===== */
.a-film {
  --ratio: 3 / 4;        /* 세로 비율*/
  --fade: 0s;
  position: relative;
  width: min(42%, 520px);   /* 세로로 길어서 너비를 줄였어요 */
  aspect-ratio: var(--ratio);
  overflow: hidden;
  background: #1c1c1c;
}
  .a-film img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    transition: opacity var(--fade) linear;
  }
  .a-film img.on { opacity: 1; }

  /* 번호 (1/6) */
  .a-count {
    position: absolute;
    top: 12px;
    right: 12px;
    padding: 4px 12px;
    border-radius: 999px;
    background: rgba(70, 70, 70, 0.75);
    color: #fff;
    font-size: 12px;
    letter-spacing: 0.04em;
  }

  /* 진행 막대 */
  .a-bar {
    position: absolute;
    left: 0;
    bottom: 0;
    height: 2px;
    width: 0;
    background: #fff;
    transition: width 0.3s linear;
  }

  /* 타이틀: 프레임 오른쪽 아래에 겹침 */
  .a-title {
    width: 68%;
    margin-top: -0.6em;
    position: relative;
    text-align: right;
    white-space: nowrap;
    font-family: Arial, Helvetica, sans-serif;
    font-size: clamp(28px, 4.6vw, 64px);
    font-weight: 400;
    line-height: 1;
    color: var(--bg);
  }
  .a-title span { display: inline-block; transform: translateX(18%); }

  /* 캡션: 양끝 정렬 */
  .a-caption {
    margin-top: clamp(40px, 8vw, 120px);
    color: var(--bg);
    font-size: clamp(14px, 1.9vw, 24px);
    line-height: 1.3;
    letter-spacing: -0.01em;
    text-align: justify;
    text-align-last: justify;
  }

  @media (max-width: 640px) {
    .a-film, .a-title { width: 100%; }
    .a-title span { transform: none; }
    .a-caption { text-align-last: left; }
  }
</style>
</head>

<body>
<div class="cursor"></div>

<header>
  <a class="logo" href="index.html">Hyerin KW</a>
  <nav>
    <a href="index.html">Work</a>
    <a href="archive.html" class="on">Archive</a>
    <a href="https://www.linkedin.com/in/hyerinkw/">Linkedin</a>
  </nav>
</header>

<main class="top a-set">
  <section>

    <!-- 사진 6장이 순서대로 재생됩니다. 첫 장에만 class="on" -->
    <figure class="a-film" id="film">
      <img class="on" src="./archive images/Btote02.jpeg"     alt="Screen printing 1">
      <img src="./archive images/Btote01.jpeg"      alt="Screen printing 2">
      <img src="./archive images/coverB.jpg"     alt="Screen printing 3">
      <img src="./archive images/inB.jpeg"     alt="Screen printing 4">
      <img src="./archive images/inB2.jpeg"   alt="Screen printing 5">
      <img src="./archive images/inB3.jpeg" alt="Screen printing 6">
      <figcaption class="a-count">1/6</figcaption>
      <span class="a-bar"></span>
    </figure>

    <h1 class="a-title"><span></span></h1>

    <p class="a-caption">
      Screen Printing
    </p>
  </section>
</main>

<script>
  /* ===== 영상처럼 재생 ===== */
  const SPEED = 900;   // 한 장당 머무는 시간(ms). 작을수록 빠름

  const film   = document.getElementById('film');
  const frames = [...film.querySelectorAll('img')];
  const count  = film.querySelector('.a-count');
  const bar    = film.querySelector('.a-bar');
  let i = 0, timer = null;

  function show(n) {
    frames[i].classList.remove('on');
    i = (n + frames.length) % frames.length;
    frames[i].classList.add('on');
    count.textContent = (i + 1) + '/' + frames.length;
    bar.style.width = ((i + 1) / frames.length * 100) + '%';
  }
  function play()  { timer = setInterval(() => show(i + 1), SPEED); }
  function pause() { clearInterval(timer); timer = null; }

  film.addEventListener('click', () => (timer ? pause() : play()));
  bar.style.width = (1 / frames.length * 100) + '%';

  /* '모션 줄이기' 설정을 켠 사람에게는 자동 재생하지 않음 */
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches) play();

  /* 커스텀 커서 */
  const cursor = document.querySelector('.cursor');
  window.addEventListener('mousemove', e => {
    cursor.style.left = e.clientX + 'px';
    cursor.style.top = e.clientY + 'px';
  });
  document.querySelectorAll('a, .a-film').forEach(el => {
    el.addEventListener('mouseenter', () => cursor.classList.add('hov'));
    el.addEventListener('mouseleave', () => cursor.classList.remove('hov'));
  });

  /* 스크롤 내리면 헤더 숨김 */
  const header = document.querySelector('header');
  let lastY = 0;
  window.addEventListener('scroll', () => {
    const y = window.scrollY;
    header.classList.toggle('hide', y > lastY && y > 80);
    lastY = y;
  });
</script>
</body>
</html>
